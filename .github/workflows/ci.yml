name: CI

# Every push, on every branch, so a branch is checked before a pull request exists.
# To make a failing check block merging, require the "check" job under
# Settings → Branches → Branch protection for the default branch.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run songs:index -- --check
      - run: npm test
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Temporary: does the app as it was before this work load in Playwright's WebKit at all?
  # The WebKit smoke test crashes on the Practice page; this says whether that is new.
  webkit-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e1b653808c721c926287946a984bacfb2526677
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps webkit
      - name: Load the original app in WebKit
        run: |
          cat > baseline.cjs <<'JS'
          const { webkit, devices } = require("playwright");
          (async () => {
            for (const device of ["iPhone 14", "Desktop Safari"]) {
              const browser = await webkit.launch();
              const page = await (await browser.newContext({ ...devices[device] })).newPage();
              const events = [];
              page.on("crash", () => events.push("CRASH"));
              page.on("pageerror", (e) => events.push("uncaught: " + e.message));
              try {
                await page.goto("http://localhost:4173/#rewrite-the-stars");
                await page.locator("h1").waitFor({ timeout: 10000 });
                console.log(`[baseline] original app, ${device}: LOADED, h1 = ${await page.locator("h1").innerText({ timeout: 3000 })}`);
                await page.getByRole("button", { name: "Play", exact: true }).click({ timeout: 5000 });
                await page.waitForTimeout(2000);
                console.log(`[baseline] original app, ${device}: still alive after pressing play: ${await page.locator("h1").innerText({ timeout: 3000 })}`);
              } catch (e) {
                console.log(`[baseline] original app, ${device}: FAILED ${String(e).split("\n")[0]} ${JSON.stringify(events)}`);
              }
              await browser.close().catch(() => {});
            }
          })();
          JS
          npx vite preview --port 4173 --strictPort &
          sleep 4
          node baseline.cjs

